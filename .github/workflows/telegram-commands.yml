name: Telegram Commands

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  telegram-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Process Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINMARKETMAN_API_TOKEN: ${{ secrets.COINMARKETMAN_API_TOKEN }}
          COINMARKETMAN_API_TOKEN_BACKUP: ${{ secrets.COINMARKETMAN_API_TOKEN_BACKUP }}
          CMM_TREND_ENRICHMENT: "true"
          CMM_SIGNAL_MAX_TREND_COINS: "3"
          CMM_SIGNAL_MAX_TREND_SEGMENTS_PER_COIN: "2"
          CMM_SIGNAL_MAX_TREND_REQUESTS: "6"
          CMM_SIGNAL_CACHE_TTL_MINUTES: "60"
          MIN_CONSENSUS_WALLETS: "4"
          TELEGRAM_POLLING_BACKUP: "true"
        run: python3 scripts/process_telegram_commands.py
