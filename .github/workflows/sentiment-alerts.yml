name: Sentiment Alerts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  sentiment-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run sentiment check
        env:
          ALERTS_ENABLED: "true"
          SEND_CHANGE_ALERTS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINMARKETMAN_API_TOKEN: ${{ secrets.COINMARKETMAN_API_TOKEN }}
          COINMARKETMAN_API_TOKEN_BACKUP: ${{ secrets.COINMARKETMAN_API_TOKEN_BACKUP }}
          CMM_TREND_ENRICHMENT: "true"
          CMM_SIGNAL_MAX_TREND_COINS: "3"
          CMM_SIGNAL_MAX_TREND_SEGMENTS_PER_COIN: "2"
          CMM_SIGNAL_MAX_TREND_REQUESTS: "6"
          CMM_SIGNAL_CACHE_TTL_MINUTES: "60"
          MIN_CONSENSUS_WALLETS: "4"
          TRACK_HIP3: "true"
          QUIET_HOURS_ENABLED: "true"
          QUIET_HOURS_TIMEZONE: "Europe/Warsaw"
          QUIET_HOURS_START: "23"
          QUIET_HOURS_END: "7"
        run: python3 scripts/run_alert_check.py

      # data/alerts.json is live state that the EC2 box's systemd timers and
      # the ThreadingHTTPServer are continuously rewriting. Committing this
      # workflow's snapshot back to main used to race those writers: the
      # `git rebase origin/main` here could resurrect this run's stale
      # snapshot over state EC2 wrote after checkout. Upload it as an
      # artifact instead so the run's state is still inspectable, without
      # ever pushing it back as the source of truth. The file is not tracked at
      # all now, so this run always starts from a cold baseline and the step
      # must tolerate the check bailing out before writing anything.
      - name: Upload alert state artifact
        uses: actions/upload-artifact@v4
        with:
          name: alert-state-${{ github.run_id }}
          path: data/alerts.json
          if-no-files-found: ignore
          retention-days: 7
